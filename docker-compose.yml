# Private mope.io server + Cloudflare Tunnel, on your own computer or any Docker host.
# Copy .env.example to .env, fill it in, then: docker compose up -d --build
# Cloudflare forwards your public hostname to the app container; no router ports are opened.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: "3000"
      SITE_PASSWORD: ${SITE_PASSWORD:?Set SITE_PASSWORD in .env}
      OWNER_EMAILS: ${OWNER_EMAILS:-}
    volumes:
      - ./data:/data # accounts and downloaded assets
    ports:
      - "127.0.0.1:3000:3000" # also reachable on this machine at http://localhost:3000

  tunnel:
    image: cloudflare/cloudflared:2024.6.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in .env (Cloudflare Zero Trust > Networks > Tunnels)}
    depends_on:
      - app
